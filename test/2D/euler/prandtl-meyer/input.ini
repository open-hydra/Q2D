[Q2D-Parameters]
iter-threshold = 2500

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl = 1.0
time-scheme = RK3
time-accurate = false
irs-beta = 0.5
integration-variables = cons
space-reconstruction = MUSCL
flux-limiter = vanleer
riemann-solver = HLLE

[Q2D-IO]
shell-diter = 100

[Q2D-Probes]
probe1 = exit

[exit]
variables = M
diter = 100
index-position = 1 50 33

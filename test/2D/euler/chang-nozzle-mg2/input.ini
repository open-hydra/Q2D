[Q2D-Parameters]
iter-threshold = 5000

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl = 0.8
time-scheme = RK3
time-accurate = false
irs-beta = 0.5
integration-variables = cons
space-reconstruction = MUSCL
flux-limiter = mc
riemann-solver = HLLC

[Q2D-Multigrid]
levels = 2
level1-iter = 5000
level2-iter = 200

[Q2D-IO]
shell-diter = 500

[Q2D-Sources]
active = axisymmetric

! Rotating-channel-RSM — frame-invariance gate for the SSGLRR rotating-frame
! closures (exact Coriolis production G_ij + W_abs C5), companion of the Euler
! parent `rotating-channel`. Uniform relative flow (grad u_rel = 0) + uniform
! anisotropic Reynolds stresses: the exact solution is the homogeneous ODE
! R'(t) = G + Pi_slow + Pi_C5(W_abs) - eps, integrated by verify.py (RK4)
! and cross-checked against the rotated inertial-frame solution
! (the frame-invariance convergence gates P-D1). Time-accurate RK3.
[Q2D-Parameters]
iter-threshold = 200000
time-threshold = 0.05
[Q2D-Physics]
equations  = navier-stokes
turbulence = SSGLRR
rotational-frame = rigid-body
[Q2D-Rotating-Frame]
omega = 10.0
axis = 0.0 0.0 1.0
origin = 0.0 0.0 0.0
[Q2D-Numerics]
cfl                   = 0.5
vnn                   = 1.0
time-scheme           = RK3
time-accurate         = true
irs-beta              = 0.0
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU
[Q2D-IO]
shell-diter = 500

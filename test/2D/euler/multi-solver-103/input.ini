[Q2D-Parameters]
iter-threshold = 500

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl                   = 0.5
cfl-rise-threshold    = 100
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.0
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU

[Q2D-IO]
shell-diter = 100

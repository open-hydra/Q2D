[Q2D-Parameters]
iter-threshold = 5000

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl = 0.5
cfl-rise-threshold = 0
time-scheme = RK3
time-accurate = false
irs-beta = 0.0
space-reconstruction = MUSCL-SD
flux-limiter = vanalbada
riemann-solver = HLLE
integration-variables = cons

[Q2D-IO]
shell-diter = 100

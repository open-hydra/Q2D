[Q2D-Parameters]
iter-threshold = 2000

[Q2D-Physics]
equations = euler
chemistry = finite-rate

[Q2D-Chemistry]
ode-solver = sdirk4b

[Q2D-Numerics]
cfl                   = 0.9
cfl-rise-threshold    = 100
time-scheme           = RK2
time-accurate         = false
irs-beta              = 0.5
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU

[Q2D-IO]
sol-diter   = 1000
shell-diter = 500
ini-diter   = 500

[Q2D-Sources]
active = axisymmetric

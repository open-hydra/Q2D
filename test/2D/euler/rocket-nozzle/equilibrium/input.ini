[Q2D-Parameters]
iter-threshold = 10000

[Q2D-Physics]
equations = euler
chemistry = equilibrium

[Q2D-Numerics]
cfl                   = 0.9
cfl-rise-threshold    = 100
time-scheme           = RK2
time-accurate         = false
irs-beta              = 0.5
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU

[Q2D-IO]
shell-diter = 100

[Q2D-Sources]
active = axisymmetric

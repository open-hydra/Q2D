[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl                   = 0.9
cfl-rise-threshold    = 100
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.3
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU

[Q2D-IO]
shell-diter = 500

[Q2D-Sources]
active = axisymmetric

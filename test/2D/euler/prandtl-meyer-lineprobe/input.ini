[Q2D-Parameters]
iter-threshold = 2500

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl = 1.0
time-scheme = RK3
time-accurate = false
irs-beta = 0.5
integration-variables = cons
space-reconstruction = MUSCL
flux-limiter = vanleer
riemann-solver = HLLE

[Q2D-IO]
shell-diter = 100

[Q2D-LineProbes]
lineprobe1 = midrow

[midrow]
variables = rho(1) u v p T M
diter = 100
index-position = 1 2
fixed-index = 25

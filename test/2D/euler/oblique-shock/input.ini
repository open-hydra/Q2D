[Q2D-Parameters]
iter-threshold = 3000

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl = 0.9
cfl-rise-threshold = 10
time-scheme = RK3
time-accurate = false
irs-beta = 0.5
riemann-solver = HLLE
space-reconstruction = MUSCL-SD
flux-limiter = vanalbada
integration-variables = cons

[Q2D-IO]
shell-diter = 100

[Q2D-Parameters]
iter-threshold = 50000

[Q2D-Physics]
equations  = navier-stokes
turbulence = SST

[Q2D-Numerics]
cfl                   = 0.5
cfl-rise-threshold    = 50
vnn                   = 1.0
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = HLLC

[Q2D-IO]
sol-diter   = 5000
shell-diter = 500

[Q2D-Sources]
active = area_variation

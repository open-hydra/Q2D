[Q2D-Parameters]
iter-threshold = 1

[Q2D-Physics]
equations = euler

[Q2D-Numerics]
cfl                   = 0.1
time-scheme           = euler
time-accurate         = false
irs-beta              = 0.0
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU

[Q2D-IO]
shell-diter = 1

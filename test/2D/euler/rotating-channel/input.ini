[Q2D-Parameters]
iter-threshold = 2000

[Q2D-Physics]
equations = euler
rotational-frame = rigid-body

[Q2D-Rotating-Frame]
omega = 10.0
axis = 0.0 0.0 1.0
origin = 0.0 0.0 0.0

[Q2D-Numerics]
cfl                   = 0.1
cfl-rise-threshold    = 100
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.0
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = vanleer
riemann-solver        = SLAU

[Q2D-IO]
shell-diter = 200

[Q2D-Parameters]
iter-threshold = 100000

[Q2D-Physics]
equations  = navier-stokes
turbulence = SSGLRR

[Q2D-Numerics]
cfl                   = 1.0
vnn                   = 1.0
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[Q2D-IO]
sol-diter   = 2000
shell-diter = 100
ini-diter   = 200

;

[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0
mil = 1.1858685985e-5
Pr = 0.72

[ICB-Block1]
type = homogeneous
p0   = 102828.0
T    = 555.
mach = 0.2
kappa = 2.25e-3
omega = 6250.

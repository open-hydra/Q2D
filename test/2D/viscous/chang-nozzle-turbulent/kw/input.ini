[Q2D-Parameters]
iter-threshold = 50000

[Q2D-Physics]
equations  = navier-stokes
turbulence = SST

[Q2D-Numerics]
cfl                   = 0.8
vnn                   = 1.0
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.5
integration-variables = cons
space-reconstruction  = MUSCL
flux-limiter          = mc
riemann-solver        = HLLC

[Q2D-IO]
sol-diter   = 5000
shell-diter = 500

[Q2D-Sources]
active = axisymmetric


[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0
mil = 1.1858685985e-5
Pr = 0.72

[ICB-Block1]
u = 1.d-6
v = 1.d-6
T = 300
p = 100000
yair = 1.d0

[BCB-Block1]
face1 = in
face2 = extrapolation
face3 = symmetry
face4 = symmetry

[in]
type = inlet
p0 = 1000000
T0 = 300
yair = 1.d0

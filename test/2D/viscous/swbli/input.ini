[Q2D-Parameters]
iter-threshold = 100000

[Q2D-Physics]
equations  = navier-stokes
turbulence = SA

[Q2D-Numerics]
cfl                   = 0.3
cfl-rise-threshold    = 1000
vnn                   = 0.1
time-scheme           = RK3
time-accurate         = false
irs-beta              = 0.0
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[Q2D-IO]
sol-diter   = 2000
shell-diter = 100
ini-diter   = 200

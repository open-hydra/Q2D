[Q2D-Parameters]
iter-threshold = 100000

[Q2D-Physics]
equations = navier-stokes

[Q2D-Numerics]
cfl                   = 0.5
cfl-rise-threshold    = 0
vnn                   = 0.5
time-scheme           = RK2
time-accurate         = false
irs-beta              = 0.0
riemann-solver        = HLLC
flux-limiter          = vanleer
space-reconstruction  = MUSCL
integration-variables = cons

[Q2D-IO]
sol-diter   = 1000
shell-diter = 100
ini-diter   = 200

;

[GPB-Phase1]
type = ideal-gas
species = air
gamma = 1.4
R = 287.0
mil = 1.e-3
Pr = 1.0

[ICB-Block1]
type = homogeneous
p = 97250.0
T = 300.
mach = 0.2

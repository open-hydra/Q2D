site_name: Q2D Documentation
site_url: https://open-hydra.github.io/Q2D/
repo_name: open-hydra/Q2D
repo_url: https://github.com/open-hydra/Q2D

exclude_docs: |

theme:
  name: material
  custom_dir: docs/overrides
  highlightjs: true
  code_style: monokai
  font:
    text: Roboto
    code: Fira Code
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
plugins:
  - macros
  - search:
      lang: en

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Q2D nav: mirrors the MOSE section structure, with Q2D-specific theory
# pages (geometric sources, axisymmetric / area-variation derivations,
# Q2D RANS closures) and per-case V&V pages.
nav:
  - Home: index.md

  - Overview: overview.md

  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md

  - User Guide:
    - user/index.md
    - Using Q2D: user/using.md
    - Input File: user/input.md
    - Input Parameters: user/registry.md
    - Initial Conditions: user/initial-conditions.md
    - Boundary Conditions: user/boundary-conditions.md

  - Theory Guide:
    - theory/index.md
    - Governing Equations: theory/governing-equations.md
    - Spatial Discretization: theory/numerics.md
    - Riemann Solvers: theory/riemann-solvers.md
    - Time Integration: theory/time-integration.md
    - Turbulence Modelling: theory/turbulence.md
    - Rotating Frame: theory/rotating-frame.md
    - Geometric Source Terms: theory/geometric-sources.md
    - 2D Axisymmetric Derivation: theory/axisymmetric-derivation.md
    - Q2D Area-Variation Derivation: theory/area-variation-derivation.md
    - Q2D RANS Closures: theory/q2d-rans-closures.md
    - Thermodynamic and Transport Properties: theory/thermo.md
    - Finite-Rate Kinetics: theory/kinetics.md
    - Chemical Equilibrium: theory/equilibrium.md

  - Verification & Validation:
    - vv/index.md
    - 1D Shock Tubes: vv/1D.md
    - Shu-Osher (LIMO3 Limiter): vv/1D-shuosher.md
    - 1D Convergence (Tables + Gates): vv/convergence-table-1D.md
    - 2D Euler Extras (Chang Nozzle, Prandtl-Meyer, Ramp Channel): vv/2D-plane-extras.md
    - Woodward-Colella Step: vv/2D-woodward-colella.md
    - Oblique Shock: vv/2D-oblique-shock.md
    - Hypersonic Cylinder: vv/2D-hypersonic-cylinder.md
    - Noh Cylindrical Implosion (Axisymmetric): vv/2D-noh-cylindrical.md
    - Coverage Matrix: vv/coverage-matrix.md
    - Planar Nozzle (Area Variation): vv/2D-planar-nozzle.md
    - Borda Channel (Injector BC): vv/2D-borda-channel.md
    - Rotating Channel (Coriolis): vv/2D-rotating-channel.md
    - Rotating Channel RSM (frame invariance): vv/2D-rotating-channel-rsm.md
    - Multi-Solver Coupling (BC 103): vv/2D-multi-solver.md
    - Rocket Nozzle: vv/2D-nozzle.md
    - SRM Rocket Motor (Vieille BC): vv/2D-srm-rocket-motor.md
    - Laminar Flat Plate: vv/2D-flat-plate-laminar.md
    - Turbulent Flat Plate: vv/2D-flat-plate-turbulent.md
    - SSG/LRR-omega Code Verification: vv/2D-ssglrr.md
    - Shock Boundary Layer Interaction: vv/2D-swbli.md

  - Developer Guide:
    - development/index.md
    - Code Structure: development/structure.md
    - Testing: development/testing.md
    - Contributing: development/contributing.md
    - Performance Notes: development/performance_notes.md

  - About:
    - about/index.md
    - Acknowledgements: about/acknowledgements.md
    - License: about/license.md
